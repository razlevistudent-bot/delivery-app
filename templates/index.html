<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cabasso Group | Master Logistics</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root { --brand: #1a1a1a; --gold: #c5a059; --bg: #f8f9fa; --white: #ffffff; --green: #27ae60; --red: #e74c3c; --locked: #bdc3c7; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; color: var(--brand); overflow-x: hidden; padding-bottom: 80px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; padding: 20px; background: linear-gradient(135deg, var(--brand) 0%, #333 100%); color: var(--gold); border-radius: 16px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* סטריפ סיכום זמן למנהל */
        .admin-stats-bar { 
            background: #2c3e50; color: white; padding: 12px; border-radius: 12px; 
            margin-bottom: 15px; text-align: center; font-size: 0.9rem; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid var(--gold);
            display: flex; justify-content: space-around; align-items: center;
        }
        .stat-item span { display: block; font-size: 1.1rem; font-weight: bold; color: var(--gold); }

        .glass-card { background: var(--white); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: #555; }
        input, select { width: 100%; padding: 14px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 12px; box-sizing: border-box; font-size: 16px; background: #fdfdfd; }
        
        .phone-group { display: flex; gap: 10px; direction: ltr; }
        .phone-group select { flex: 0.35; } .phone-group input { flex: 0.65; text-align: left; }

        #map { height: 220px; border-radius: 16px; margin-bottom: 15px; z-index: 1; border: 2px solid white; }
        
        .route-item { background: var(--white); padding: 18px; border-radius: 14px; margin-bottom: 12px; border-right: 5px solid var(--gold); position: relative; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .route-item.is-locked { opacity: 0.5; filter: grayscale(1); pointer-events: none; border-right-color: var(--locked); background: #f9f9f9; }
        .route-item.is-completed { border-right-color: var(--green); background: #f0fff4; opacity: 0.8; }
        .route-item.is-skipped { border-right-color: var(--red); background: #fff5f5; opacity: 0.8; }

        .actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .btn { flex: 1; text-align: center; padding: 12px; border-radius: 10px; color: white; font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .btn-waze { background: #33ccff; } .btn-call { background: var(--green); flex: 0.4; } 
        .btn-done { background: var(--brand); color: var(--gold); }
        .btn-skip { background: #95a5a6; font-size: 0.8rem; flex: 0.4; }
        .btn-whatsapp { background: var(--green); width: 100%; margin-top: 10px; }
        .btn-share { background: #2980b9; width: 100%; margin-top: 15px; font-size: 1rem; padding: 15px; }
        .btn-export { background: #34495e; width: 100%; margin-top: 20px; font-size: 0.85rem; }
        
        .admin-tools-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-optimize { background: linear-gradient(45deg, var(--gold), #f1c40f); color: black; flex: 1; }
        .btn-manual { background: #95a5a6; color: white; flex: 1; }
        
        .admin-actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .btn-reset { background: var(--red); opacity: 0.8; }
        .btn-refresh { background: #34495e; }
        .edit-tools { display: none; gap: 8px; margin-top: 10px; }
        
        .suggestions-box { position: absolute; background: white; border: 1px solid #ddd; width: calc(100% - 40px); z-index: 1000; max-height: 250px; overflow-y: auto; border-radius: 0 0 10px 10px; display: none; }
        .suggestion-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .suggestion-item:hover { background: #fdf5e6; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; }
        #signature-pad { border: 2px dashed #ccc; background: #fdfdfd; touch-action: none; width: 100%; height: 180px; border-radius: 12px; margin: 15px 0; }

        #startShiftModal { display: none; z-index: 3000; background: var(--brand); }
        .start-btn { background: var(--gold); color: black; font-size: 1.2rem; padding: 20px; width: 100%; border-radius: 12px; font-weight: bold; animation: pulse 2s infinite; border: none; cursor: pointer; }

        .number-marker { background: var(--brand); color: var(--gold); border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .badge { font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; background: #eee; display: inline-block; margin-bottom: 8px; font-weight: bold; }
        .badge.active { background: var(--gold); color: black; }
        .drag-handle { float: left; color: #ccc; cursor: grab; padding: 0 10px; font-size: 1.2rem; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="startShiftModal" class="modal">
    <div class="modal-content" style="background: transparent; color: white; border: none; box-shadow: none;">
        <h1 style="color: var(--gold); margin-bottom: 20px;">התחלת משמרת</h1>
        <p style="margin-bottom: 30px;">חובה לשתף מיקום חי עם המנהל לפני יציאה.</p>
        <button onclick="startShift()" class="start-btn">📍 שתף מיקום והתחל</button>
    </div>
</div>

<div class="container">
    <header>
        <h1>CABASSO GROUP</h1>
        <p id="mode-text">מערכת לוגיסטיקה</p>
    </header>

    <div class="glass-card" style="background: #222; color: white;">
        <label style="color: #aaa; font-size: 0.75rem;">מספר מנהל לדיווחים (WhatsApp):</label>
        <input type="tel" id="managerPhone" placeholder="0501234567" onchange="saveManager()" style="background:#333; color:white; border:none; margin-bottom:0;">
        <div style="margin-top: 10px;">
            <label style="color: #aaa; font-size: 0.75rem;">מייל מנהל לחתימות:</label>
            <input type="email" id="managerEmail" placeholder="manager@cabasso.com" onchange="localStorage.setItem('manager_email', this.value)" style="background:#333; color:white; border:none; margin-bottom:0;">
        </div>
    </div>

    <div id="adminStats" class="admin-stats-bar" style="display:none;">
        <div class="stat-item">משלוחים<span id="statCount">0</span></div>
        <div class="stat-item">זמן נסיעה<span id="statDrive">0 דק'</span></div>
        <div class="stat-item">זמן פריקה<span id="statWork">0 דק'</span></div>
        <div class="stat-item">סה"כ<span id="statTotal" style="color:#2ecc71">00:00</span></div>
    </div>

    <div id="admin-panel" class="glass-card">
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="admin-tools-row">
            <button onclick="alert('ניתן לגרור את הכרטיסים למטה כדי לשנות סדר ידנית')" class="btn btn-manual">🖐️ סידור ידני</button>
            <button onclick="optimizeRouteForAdmin()" class="btn btn-optimize">⚡ סידור חכם (זמן+מרחק)</button>
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex:1.5">
                <label>שם לקוח</label>
                <input type="text" id="custName" placeholder="שם מלא" list="customerList" oninput="fillCustomerPhone()">
                <datalist id="customerList"></datalist>
            </div>
            <div style="flex:1"><label>הזמנה #</label><input type="text" id="orderNum" placeholder="1001"></div>
        </div>
        <div style="position: relative;">
            <label>כתובת</label>
            <input type="text" id="addressInput" placeholder="הקלד כתובת..." oninput="debounceSearch()" autocomplete="off">
            <div id="suggestions" class="suggestions-box"></div>
        </div>
        <label>טלפון לקוח</label>
        <div class="phone-group">
            <select id="phonePrefix"><option value="050">050</option><option value="052">052</option><option value="054">054</option><option value="053">053</option><option value="058">058</option><option value="055">055</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="08">08</option><option value="09">09</option></select>
            <input type="tel" id="custPhone" placeholder="XXXXXXX" maxlength="7">
        </div>
        <button id="addBtn" onclick="addNewLocation()" class="btn" style="background:var(--brand); color:var(--gold); width:100%; margin-bottom:8px;">הוסף למסלול ➕</button>
        
        <div class="admin-actions">
            <button onclick="clearAll()" class="btn btn-reset">איפוס 🗑️</button>
            <button onclick="toggleEditMode()" id="editModeBtn" class="btn btn-refresh">עריכה ✏️</button>
        </div>

        <button onclick="generateShortLink()" class="btn btn-share">סיום ושלח מסלול לנהג 📲</button>
    </div>

    <div id="map"></div>
    <div id="addressList"></div>
    <button onclick="exportDailyReport()" class="btn btn-export">הורד דוח יומי (Excel) 📊</button>
</div>

<div id="signatureModal" class="modal">
    <div class="modal-content">
        <h3>חתימת לקוח</h3>
        <canvas id="signature-pad"></canvas>
        <div class="actions">
            <button onclick="clearSignature()" class="btn" style="background:#888;">נקה</button>
            <button onclick="saveSignature()" class="btn" style="background:var(--green);">שלח וסיים ✅</button>
        </div>
    </div>
</div>

<div id="toast" style="visibility:hidden; min-width:250px; background-color:#333; color:#fff; text-align:center; border-radius:50px; padding:16px; position:fixed; z-index:9999; left:50%; bottom:30px; transform:translateX(-50%);">הודעה</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const EMAILJS_SERVICE_ID = "service_XXX"; 
    const EMAILJS_TEMPLATE_ID = "template_XXX"; 
    const EMAILJS_PUBLIC_KEY = "XXX"; 

    (function() { emailjs.init(EMAILJS_PUBLIC_KEY); })();

    var map = L.map('map').setView([32.0853, 34.7818], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var locations = [];
    var markers = [];
    var currentSignIndex = null;
    var isEditMode = false;
    var sortableInstance = null;
    var topSuggestion = null;
    var customers = JSON.parse(localStorage.getItem('cabasso_customers')) || {};

    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    function getPos(e) { const r = canvas.getBoundingClientRect(); const x = (e.touches?e.touches[0].clientX:e.clientX)-r.left; const y = (e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x,y}; }
    ['mousedown','touchstart'].forEach(ev=>canvas.addEventListener(ev,e=>{drawing=true;ctx.moveTo(getPos(e).x,getPos(e).y);}));
    ['mousemove','touchmove'].forEach(ev=>{canvas.addEventListener(ev,e=>{if(drawing){e.preventDefault();ctx.lineTo(getPos(e).x,getPos(e).y);ctx.stroke();}});});
    ['mouseup','touchend'].forEach(ev=>drawing=false);

    window.onload = function() {
        const dataParam = new URLSearchParams(window.location.search).get('d');
        if (dataParam) {
            // מצב נהג
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('adminStats').style.display = 'none'; // הסתרת סיכום מנהל לנהג
            document.getElementById('mode-text').innerText = "נהג - מסלול קבוע";
            try { locations = JSON.parse(decodeURIComponent(atob(dataParam))); } catch(e){}
            
            if (!sessionStorage.getItem('shiftStarted')) {
                document.getElementById('startShiftModal').style.display = 'flex';
            }
        } else {
            // מצב מנהל
            document.getElementById('adminStats').style.display = 'flex';
            locations = JSON.parse(localStorage.getItem('cabasso_pro')) || [];
            initSortable();
            loadCustomerDatalist();
            updateAdminStats(); // חישוב ראשוני
        }
        document.getElementById('managerPhone').value = localStorage.getItem('manager_num') || '';
        document.getElementById('managerEmail').value = localStorage.getItem('manager_email') || '';
        
        document.getElementById('addressInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); if (topSuggestion) { selectAddress(topSuggestion); } else { addNewLocation(); } }
        });
        updateUI();
    };

    function save() { localStorage.setItem('cabasso_pro', JSON.stringify(locations)); }
    function saveManager() { localStorage.setItem('manager_num', document.getElementById('managerPhone').value); }

    // --- חישוב סטטיסטיקות למנהל ---
    function updateAdminStats() {
        if(locations.length === 0) return;
        
        let totalDriveMinutes = 0;
        let totalWorkMinutes = locations.length * 15; // 15 דקות לכל נקודה
        
        // חישוב מרחק אווירי פשוט בין כל הנקודות להערכת זמן נסיעה
        // (הערכה: 40 קמ"ש ממוצע בעיר)
        for (let i = 0; i < locations.length - 1; i++) {
            const dist = getDistance(locations[i].lat, locations[i].lng, locations[i+1].lat, locations[i+1].lng);
            // זמן בדקות = (מרחק / מהירות) * 60. הוספנו מקדם 1.3 לעומס
            totalDriveMinutes += (dist / 40) * 60 * 1.3;
        }

        const totalMinutes = Math.round(totalDriveMinutes + totalWorkMinutes);
        const hours = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;

        document.getElementById('statCount').innerText = locations.length;
        document.getElementById('statDrive').innerText = Math.round(totalDriveMinutes) + " דק'";
        document.getElementById('statWork').innerText = totalWorkMinutes + " דק'";
        document.getElementById('statTotal').innerText = `${hours} ש' ${mins} דק'`;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = (lat2-lat1) * Math.PI/180;
        const dLon = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // --- אופטימיזציה חכמה למנהל (TSP בסיסי) ---
    function optimizeRouteForAdmin() {
        if (locations.length < 2) return alert("צריך לפחות 2 נקודות לסידור");
        
        // שומרים את הנקודה הראשונה כנקודת מוצא (מחסן/יציאה)
        let optimized = [locations[0]];
        let unvisited = locations.slice(1);
        
        while (unvisited.length > 0) {
            let lastLoc = optimized[optimized.length - 1];
            let closestIdx = 0;
            let minDistance = Infinity;

            for (let i = 0; i < unvisited.length; i++) {
                let dist = getDistance(lastLoc.lat, lastLoc.lng, unvisited[i].lat, unvisited[i].lng);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestIdx = i;
                }
            }
            optimized.push(unvisited.splice(closestIdx, 1)[0]);
        }
        
        locations = optimized;
        save();
        updateUI();
        updateAdminStats();
        alert("המסלול סודר מחדש לפי זמן ומרחק אופטימליים! ⚡");
    }

    // --- פונקציות נהג ---
    function startShift() {
        const mPhone = document.getElementById('managerPhone').value.replace(/\D/g,'');
        if(!mPhone) return alert("מספר מנהל חסר");
        window.open(`https://wa.me/972${mPhone.startsWith('0')?mPhone.substring(1):mPhone}?text=${encodeURIComponent("אני מתחיל משמרת, לחץ לשיתוף מיקום חי")}`, '_blank');
        document.getElementById('startShiftModal').style.display = 'none';
        sessionStorage.setItem('shiftStarted', 'true');
    }

    // --- שאר הלוגיקה (זהה לקודם) ---
    function loadCustomerDatalist() { const list = document.getElementById('customerList'); list.innerHTML = ''; Object.keys(customers).sort().forEach(name => { const option = document.createElement('option'); option.value = name; list.appendChild(option); }); }
    function fillCustomerPhone() { const name = document.getElementById('custName').value; if (customers[name]) { const full = customers[name]; document.getElementById('phonePrefix').value = full.substring(0,3); document.getElementById('custPhone').value = full.substring(3); } }
    
    let debounceTimer;
    function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(searchAddress, 300); }
    async function searchAddress() {
        const query = document.getElementById('addressInput').value;
        const box = document.getElementById('suggestions');
        if (query.length < 3) { box.style.display = 'none'; return; }
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1&countrycodes=il`);
            const data = await res.json();
            box.innerHTML = '';
            if (data.length > 0) {
                topSuggestion = data[0]; box.style.display = 'block';
                data.forEach((item, index) => {
                    const div = document.createElement('div'); div.className = 'suggestion-item';
                    const addr = item.address;
                    let main = (addr.road||addr.street||query) + (addr.house_number ? " "+addr.house_number : "");
                    let sub = addr.city || addr.town || "";
                    div.innerHTML = `<div style="font-weight:bold">${main}</div><div style="font-size:0.8rem">${sub}</div>`;
                    div.onclick = () => selectAddress(item); box.appendChild(div);
                });
            } else { box.style.display = 'none'; topSuggestion = null; }
        } catch (e) {}
    }
    function selectAddress(item) {
        const input = document.getElementById('addressInput');
        const orig = input.value.match(/\d+$/);
        const userNum = orig ? orig[0] : '';
        const addr = item.address;
        let final = (addr.road||addr.street||'') + " " + (addr.house_number||userNum) + ", " + (addr.city||'');
        input.value = final; input.dataset.lat = item.lat; input.dataset.lng = item.lon;
        document.getElementById('suggestions').style.display = 'none';
        document.getElementById('custPhone').focus();
    }

    async function addNewLocation() {
        const input = document.getElementById('addressInput');
        let lat = input.dataset.lat, lng = input.dataset.lng;
        if (!lat) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(input.value)}&limit=1`);
            const d = await res.json();
            if (d.length > 0) { lat = d[0].lat; lng = d[0].lon; }
            else if(!confirm("לא נמצא מיקום. להוסיף?")) return;
        } 
        const prefix = document.getElementById('phonePrefix').value;
        const num = document.getElementById('custPhone').value;
        const name = document.getElementById('custName').value;
        const idx = parseInt(document.getElementById('editIndex').value);

        if (name && num) { customers[name] = prefix + num; localStorage.setItem('cabasso_customers', JSON.stringify(customers)); loadCustomerDatalist(); }

        const newLoc = {
            name: input.value, custName: name || 'לקוח', orderId: document.getElementById('orderNum').value || '---',
            phone: num ? (prefix + num) : '', lat: parseFloat(lat||32), lng: parseFloat(lng||34),
            completed: false, reported: false, skipped: false, time: null
        };

        if (idx > -1) { locations[idx] = newLoc; document.getElementById('editIndex').value = "-1"; document.getElementById('addBtn').innerText = "הוסף למסלול ➕"; document.getElementById('addBtn').style.background = "var(--brand)"; } 
        else { locations.push(newLoc); }
        
        input.dataset.lat = ''; input.dataset.lng = '';
        ['addressInput','custName','orderNum','custPhone'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('custName').focus(); save(); updateUI(); updateAdminStats();
    }

    function initSortable() { const el = document.getElementById('addressList'); sortableInstance = Sortable.create(el, { handle: '.route-item', animation: 150, onEnd: function (evt) { const item = locations.splice(evt.oldIndex, 1)[0]; locations.splice(evt.newIndex, 0, item); save(); updateUI(); } }); }

    function updateUI() {
        const list = document.getElementById('addressList'); list.innerHTML = '';
        markers.forEach(m => map.removeLayer(m)); markers = [];
        let foundActive = false;

        locations.forEach((loc, i) => {
            let isLocked = foundActive && !loc.reported && !loc.skipped;
            if (!loc.reported && !loc.skipped) foundActive = true;

            const item = document.createElement('div');
            item.className = `route-item ${loc.reported ? 'is-completed' : ''} ${loc.skipped ? 'is-skipped' : ''} ${isLocked ? 'is-locked' : ''}`;
            const mPhone = document.getElementById('managerPhone').value.replace(/\D/g,'');
            const msg = encodeURIComponent(`💡 Cabasso Group\n📦 הזמנה: ${loc.orderId}\n👤 לקוח: ${loc.custName}\n📍 כתובת: ${loc.name}\n✅ סטטוס: נמסר!`);
            const waLink = `https://wa.me/972${mPhone.startsWith('0')?mPhone.substring(1):mPhone}?text=${msg}`;

            let statusText = 'ממתין';
            if (loc.reported) statusText = 'נמסר: ' + loc.time;
            else if (loc.skipped) statusText = 'דילוג: ' + loc.time;
            else if (isLocked) statusText = 'נעול 🔒';
            else statusText = 'בטיפול כעת 🚚';

            // מנהל רואה אייקון גרירה, נהג לא
            const showDrag = !new URLSearchParams(window.location.search).get('d');

            item.innerHTML = `
                ${showDrag ? '<span class="drag-handle" style="display:block; float:left;">☰</span>' : ''}
                <span class="badge ${loc.reported ? 'active' : ''}">${statusText}</span>
                <div style="font-weight:700; font-size:1.1rem;">${i+1}. ${loc.custName} <span style="font-weight:400; font-size:0.9rem;">(#${loc.orderId})</span></div>
                <div style="font-size:0.9rem; color:#666; margin-bottom:5px;">${loc.name}</div>
                
                <div class="actions">
                    ${!loc.completed && !loc.skipped && !isLocked && !isEditMode ? `
                        <a href="https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes" class="btn btn-waze">Waze</a>
                        ${loc.phone.length > 3 ? `<a href="tel:${loc.phone}" class="btn btn-call">📞 חיוג</a>` : ''}
                        <button onclick="openSignature(${i})" class="btn btn-done">סיום</button>
                        <button onclick="skipLocation(${i})" class="btn btn-skip">אין מענה</button>
                    ` : ''}
                    ${loc.completed && !loc.reported && !isEditMode ? `<a href="${waLink}" target="_blank" class="btn btn-whatsapp" onclick="reportDone(${i})">דווח למנהל לשחרור הבא 🔓</a>` : ''}
                </div>
                
                <div class="edit-tools" style="${isEditMode ? 'display:flex' : 'display:none'}">
                    <button onclick="editItem(${i})" class="btn" style="background:#f39c12; font-size:0.8rem;">עריכה 📝</button>
                    <button onclick="deleteItem(${i})" class="btn" style="background:#c0392b; font-size:0.8rem;">מחיקה ❌</button>
                </div>`;
            list.appendChild(item);
            const icon = L.divIcon({ className: 'number-marker', html: i + 1, iconSize: [25, 25] });
            markers.push(L.marker([loc.lat, loc.lng], {icon}).addTo(map));
        });
        if (markers.length > 0) map.fitBounds(new L.featureGroup(markers).getBounds().pad(0.2));
    }

    function reportDone(i) { locations[i].reported = true; locations[i].time = new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); save(); setTimeout(updateUI, 1500); }
    function skipLocation(i) { if(confirm("לדלג על הכתובת?")) { locations[i].skipped = true; locations[i].time = new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); save(); updateUI(); } }
    function openSignature(i) { currentSignIndex = i; document.getElementById('signatureModal').style.display = 'flex'; ctx.clearRect(0,0,canvas.width,canvas.height); }
    function clearSignature() { ctx.clearRect(0,0,canvas.width,canvas.height); }
    
    function saveSignature() { 
        locations[currentSignIndex].completed = true; 
        document.getElementById('signatureModal').style.display = 'none'; 
        const img = canvas.toDataURL("image/png");
        const mEmail = document.getElementById('managerEmail').value;
        const loc = locations[currentSignIndex];
        
        if(mEmail && typeof emailjs !== 'undefined') {
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                to_email: mEmail,
                customer_name: loc.custName,
                order_id: loc.orderId,
                address: loc.name,
                signature_image: img
            });
        }
        updateUI(); 
    }
    
    function toggleEditMode() { isEditMode = !isEditMode; document.getElementById('editModeBtn').innerText = isEditMode ? "סיום עריכה ✅" : "עריכה ✏️"; document.getElementById('editModeBtn').style.background = isEditMode ? "var(--green)" : "#34495e"; if(isEditMode && sortableInstance) sortableInstance.option("disabled", true); else if(sortableInstance) sortableInstance.option("disabled", false); updateUI(); }
    function editItem(i) { const loc = locations[i]; document.getElementById('custName').value = loc.custName; document.getElementById('orderNum').value = loc.orderId; document.getElementById('addressInput').value = loc.name; if(loc.phone) { document.getElementById('phonePrefix').value = loc.phone.substring(0,3); document.getElementById('custPhone').value = loc.phone.substring(3); } document.getElementById('editIndex').value = i; document.getElementById('addBtn').innerText = "שמור שינויים ✔️"; document.getElementById('addBtn').style.background = "var(--green)"; window.scrollTo({top:0, behavior:'smooth'}); }
    function deleteItem(i) { if(confirm("למחוק?")) { locations.splice(i, 1); save(); updateUI(); updateAdminStats(); } }
    function clearAll() { if(confirm("לאפס את כל המערכת?")) { locations = []; save(); updateUI(); updateAdminStats(); } }
    function showToast(msg) { const x = document.getElementById("toast"); x.innerText = msg; x.className = "show"; setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000); }
    async function generateShortLink() { if(locations.length===0) return showToast("ריק"); const encoded = btoa(encodeURIComponent(JSON.stringify(locations))); const longLink = window.location.origin + window.location.pathname + "?d=" + encoded; try { const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longLink)}`); const d = await res.json(); const link = d.shorturl || longLink; window.location.href = `https://wa.me/?text=${encodeURIComponent("מסלול חלוקה Cabasso: " + link)}`; } catch(e) { window.location.href = `https://wa.me/?text=${encodeURIComponent("מסלול חלוקה: " + longLink)}`; } }
    function exportDailyReport() { let csv = "הזמנה,לקוח,כתובת,סטטוס,שעה\n"; locations.forEach(l => { let s = l.reported ? "בוצע" : (l.skipped ? "דילוג" : "טרם"); csv += `${l.orderId},${l.custName},"${l.name}",${s},${l.time||'-'}\n`; }); const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'}); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Report_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`; link.click(); }
</script>
</body>
</html>
