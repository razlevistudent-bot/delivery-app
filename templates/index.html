<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabasso Group | Secure Delivery</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #1a1a1a; --gold: #c5a059; --bg: #f4f4f4; --white: #fff; --green: #27ae60; --locked: #bdc3c7; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; padding: 15px; background: var(--brand); color: var(--gold); border-radius: 15px; margin-bottom: 10px; border-bottom: 3px solid var(--gold); }
        .glass-card { background: var(--white); border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        
        .route-item { background: var(--white); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid var(--gold); position: relative; }
        .route-item.is-locked { opacity: 0.4; filter: grayscale(1); pointer-events: none; border-right-color: var(--locked); }
        .route-item.is-completed { border-right-color: var(--green); background: #f0fdf4; }
        
        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn { flex: 1; text-align: center; padding: 12px; border-radius: 8px; color: white; text-decoration: none; font-size: 0.9rem; font-weight: bold; border: none; cursor: pointer; }
        .btn-waze { background: #33ccff; } 
        .btn-done { background: var(--brand); color: var(--gold); }
        .btn-whatsapp { background: var(--green); width: 100%; display: block; margin-top: 10px; }
        .btn-share { background: #007bff; color: white; margin-top: 5px; }
        
        .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: #eee; display: inline-block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CABASSO GROUP</h1>
        <p id="mode-text">מערכת ניהול חלוקה</p>
    </header>

    <div class="glass-card" id="admin-settings" style="background: #222; color: white;">
        <label style="font-size: 0.7rem; color: #aaa;">מספר מנהל לדיווחים:</label>
        <input type="tel" id="managerPhone" placeholder="0501234567" onchange="saveManager()" style="background:#333; color:white; border:none;">
        
        <div id="admin-tools">
            <h3 style="margin: 10px 0 5px 0; font-size: 1rem;">הוספת כתובת</h3>
            <input type="text" id="custName" placeholder="שם לקוח">
            <input type="text" id="addressInput" placeholder="עיר, רחוב ומספר">
            <button onclick="addNewLocation()" class="btn" style="background:var(--gold); color:black;">הוסף למסלול +</button>
            <button onclick="shareToDriver()" class="btn btn-share">שלח מסלול לנהג 📲</button>
        </div>
    </div>

    <div id="addressList" style="margin-top: 15px;"></div>
    
    <center><button onclick="clearAll()" style="background:none; color:red; font-size:0.7rem; border:none; margin-top:20px; cursor:pointer;">איפוס נתונים</button></center>
</div>

<script>
    var locations = [];
    var routeId = new URLSearchParams(window.location.search).get('r');
    
    // טעינת הגדרות
    document.getElementById('managerPhone').value = localStorage.getItem('manager_num') || '';
    function saveManager() { localStorage.setItem('manager_num', document.getElementById('managerPhone').value); }

    window.onload = async function() {
        if (routeId) {
            // אם יש ID בכתובת, אנחנו במצב נהג - מסתירים כלי מנהל וטוענים מהשרת
            document.getElementById('admin-tools').style.display = 'none';
            document.getElementById('mode-text').innerText = "מצב נהג - חלוקה מבוקרת";
            
            const res = await fetch(`/get_route/${routeId}`);
            const data = await res.json();
            if(data.locations) {
                locations = data.locations;
            }
        } else {
            // מצב מנהל - טעינה מהזיכרון המקומי
            locations = JSON.parse(localStorage.getItem('cabasso_strict_v1')) || [];
        }
        updateUI();
    };

    function updateUI() {
        const list = document.getElementById('addressList');
        list.innerHTML = '';
        let foundActive = false;

        locations.forEach((loc, i) => {
            const item = document.createElement('div');
            let isLocked = false;
            
            if (foundActive) isLocked = true;
            if (!loc.reported) foundActive = true;

            item.className = `route-item ${loc.reported ? 'is-completed' : ''} ${isLocked ? 'is-locked' : ''}`;
            
            const managerNum = document.getElementById('managerPhone').value;
            const reportMsg = encodeURIComponent(`✅ דיווח חלוקה - Cabasso Group:\nלקוח: ${loc.custName}\nכתובת: ${loc.name}\nסטטוס: בוצע!`);
            const reportUrl = `https://wa.me/972${managerNum.replace(/^0/, '')}?text=${reportMsg}`;

            item.innerHTML = `
                <span class="badge">${loc.reported ? 'בוצע ודווח' : (isLocked ? '🔒 חסום' : '🚚 התחנה הבאה')}</span>
                <div style="font-weight:bold;">${i+1}. ${loc.custName}</div>
                <div style="font-size:0.85rem; color:#666;">${loc.name}</div>
                
                <div class="actions">
                    ${!loc.completed && !isLocked ? `
                        <a href="https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes" class="btn btn-waze">Waze</a>
                        <button onclick="markDone(${i})" class="btn btn-done">סיימתי</button>
                    ` : ''}
                    
                    ${loc.completed && !loc.reported ? `
                        <a href="${reportUrl}" target="_blank" class="btn btn-whatsapp" onclick="markReported(${i})">דווח למנהל לשחרור המשך 🔓</a>
                    ` : ''}
                </div>
            `;
            list.appendChild(item);
        });
    }

    function markDone(i) {
        locations[i].completed = true;
        if (routeId) syncWithServer();
        updateUI();
    }

    function markReported(i) {
        locations[i].reported = true;
        if (routeId) syncWithServer();
        setTimeout(updateUI, 1000);
    }

    async function syncWithServer() {
        if (!routeId) return;
        await fetch(`/update_status/${routeId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ locations: locations, driver_pos: {} })
        });
    }

    async function addNewLocation() {
        const addr = document.getElementById('addressInput').value;
        const name = document.getElementById('custName').value;
        if(!addr) return;

        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1`);
        const data = await res.json();
        
        if (data.length > 0) {
            locations.push({
                name: addr, custName: name || 'לקוח',
                lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon),
                completed: false, reported: false
            });
            localStorage.setItem('cabasso_strict_v1', JSON.stringify(locations));
            updateUI();
            document.getElementById('addressInput').value = '';
            document.getElementById('custName').value = '';
        }
    }

    async function shareToDriver() {
        const res = await fetch('/save_route', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ locations })
        });
        const data = await res.json();
        const link = `${window.location.origin}/?r=${data.route_id}`;
        window.open(`https://wa.me/?text=${encodeURIComponent("היי, זה מסלול החלוקה המבוקר שלך: " + link)}`, '_blank');
    }

    function clearAll() { if(confirm("למחוק הכל?")) { locations = []; localStorage.removeItem('cabasso_strict_v1'); updateUI(); } }
</script>
</body>
</html>
