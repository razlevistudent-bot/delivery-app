<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabasso Group | Smart Logistics</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #1a1a1a; --gold: #c5a059; --bg: #f4f4f4; --white: #fff; --green: #27ae60; --locked: #bdc3c7; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; color: var(--brand); }
        .container { max-width: 500px; margin: 0 auto; }
        
        header { 
            text-align: center; padding: 15px; background: var(--brand); color: var(--gold); 
            border-radius: 15px; margin-bottom: 10px; border-bottom: 3px solid var(--gold); 
        }
        
        .glass-card { background: var(--white); border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8rem; font-weight: bold; }
        
        input, select { 
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; 
            margin-bottom: 10px; box-sizing: border-box; font-family: inherit; 
        }
        
        .phone-group { display: flex; gap: 8px; direction: ltr; }
        .phone-group select { flex: 0.35; }
        .phone-group input { flex: 0.65; text-align: left; }

        #map { height: 250px; border-radius: 12px; margin-bottom: 10px; z-index: 1; border: 1px solid #ddd; }
        
        .route-item { background: var(--white); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid var(--gold); position: relative; }
        .route-item.is-locked { opacity: 0.4; filter: grayscale(1); pointer-events: none; border-right-color: var(--locked); }
        .route-item.is-completed { border-right-color: var(--green); background: #f0fdf4; }
        
        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn { 
            flex: 1; text-align: center; padding: 12px; border-radius: 8px; color: white; 
            text-decoration: none; font-size: 0.9rem; font-weight: bold; border: none; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        .btn-waze { background: #33ccff; } 
        .btn-call { background: #555; }
        .btn-done { background: var(--brand); color: var(--gold); }
        .btn-whatsapp { background: var(--green); width: 100%; margin-top: 10px; }
        .btn-share { background: #007bff; color: white; width: 100%; margin-top: 5px; }
        .btn-opt { background: var(--gold); color: black; margin-bottom: 10px; }
        .btn-export { background: #6c757d; color: white; margin-top: 20px; font-size: 0.8rem; }

        .number-marker { 
            background: var(--brand); color: var(--gold); border: 2px solid var(--gold); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 14px; 
        }
        
        .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: #eee; display: inline-block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CABASSO GROUP</h1>
        <p id="mode-text">לוגיסטיקה Clight</p>
    </header>

    <div class="glass-card" style="background: #222; color: white;">
        <label style="font-size: 0.7rem; color: #aaa;">מספר מנהל לדיווחים (WhatsApp):</label>
        <input type="tel" id="managerPhone" placeholder="0501234567" onchange="saveManager()" style="background:#333; color:white; border:none;">
    </div>

    <div id="admin-panel" class="glass-card">
        <div style="display: flex; gap: 5px;">
            <input type="text" id="custName" placeholder="שם לקוח" style="flex:1.5">
            <input type="text" id="orderNum" placeholder="הזמנה #" style="flex:1">
        </div>
        <input type="text" id="addressInput" placeholder="עיר, רחוב ומספר בית">
        
        <label>טלפון לקוח</label>
        <div class="phone-group">
            <select id="phonePrefix">
                <option value="050">050</option><option value="052">052</option><option value="054">054</option>
                <option value="053">053</option><option value="058">058</option>
            </select>
            <input type="tel" id="custPhone" placeholder="7 ספרות" maxlength="7">
        </div>

        <button onclick="addNewLocation()" class="btn" style="background:var(--brand); color:var(--gold); width:100%; margin-bottom:5px; border:1px solid var(--gold);">הוסף למסלול +</button>
        <button onclick="generateShortLink()" class="btn btn-share">שתף מסלול קצר לנהג 📲</button>
    </div>

    <button id="optBtn" onclick="optimizeForDriver()" class="btn btn-opt" style="display:none; width:100%;">סדר מסלול חכם (מהמיקום שלי) 🚀</button>

    <div id="map"></div>
    <div id="addressList"></div>
    
    <button onclick="exportSummary()" class="btn btn-export">הורד סיכום יומי (Excel/CSV) 📊</button>
    <center><button onclick="clearAll()" style="background:none; color:red; font-size:0.7rem; border:none; margin:20px 0; cursor:pointer;">איפוס מערכת</button></center>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([32.0853, 34.7818], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var locations = [];
    var markers = [];

    function encodeData(data) { return btoa(encodeURIComponent(JSON.stringify(data))); }
    function decodeData(str) { return JSON.parse(decodeURIComponent(atob(str))); }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('d');
        
        if (dataParam) {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('optBtn').style.display = 'block';
            document.getElementById('mode-text').innerText = "מצב נהג - חלוקה מבוקרת";
            try {
                locations = decodeData(dataParam);
            } catch(e) { alert("שגיאה בטעינת הנתונים"); }
        } else {
            locations = JSON.parse(localStorage.getItem('cabasso_strict')) || [];
        }
        document.getElementById('managerPhone').value = localStorage.getItem('manager_num') || '';
        updateUI();
    };

    function saveManager() { localStorage.setItem('manager_num', document.getElementById('managerPhone').value); }

    async function addNewLocation() {
        const addr = document.getElementById('addressInput').value;
        const prefix = document.getElementById('phonePrefix').value;
        const num = document.getElementById('custPhone').value;
        if(!addr) return;

        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1`);
        const data = await res.json();
        if (data.length > 0) {
            locations.push({
                name: addr, custName: document.getElementById('custName').value || 'לקוח',
                orderId: document.getElementById('orderNum').value || '0000',
                phone: num ? prefix + num : '',
                lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon),
                completed: false, reported: false, time: null
            });
            localStorage.setItem('cabasso_strict', JSON.stringify(locations));
            updateUI();
            ['addressInput','custName','orderNum','custPhone'].forEach(id => document.getElementById(id).value = '');
        } else { alert("כתובת לא נמצאה"); }
    }

    async function generateShortLink() {
        if (locations.length === 0) return alert("אין כתובות ברשימה");
        const btn = document.querySelector('.btn-share');
        btn.innerText = "מייצר קישור... ⏳";
        btn.disabled = true;

        const encoded = encodeData(locations);
        const longLink = window.location.origin + window.location.pathname + "?d=" + encoded;

        try {
            const response = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longLink)}`);
            const data = await response.json();
            const finalLink = data.shorturl || longLink;
            window.open(`https://wa.me/?text=${encodeURIComponent("מסלול חלוקה Cabasso Group: " + finalLink)}`, '_blank');
        } catch (e) {
            window.open(`https://wa.me/?text=${encodeURIComponent("מסלול חלוקה: " + longLink)}`, '_blank');
        } finally {
            btn.innerText = "שתף מסלול קצר לנהג 📲";
            btn.disabled = false;
        }
    }

    function updateUI() {
        const list = document.getElementById('addressList');
        list.innerHTML = '';
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        let foundActive = false;

        locations.forEach((loc, i) => {
            const item = document.createElement('div');
            let isLocked = false;
            if (foundActive) isLocked = true;
            if (!loc.reported) foundActive = true;

            item.className = `route-item ${loc.reported ? 'is-completed' : ''} ${isLocked ? 'is-locked' : ''}`;
            const managerNum = document.getElementById('managerPhone').value;
            const reportMsg = encodeURIComponent(`💡 Cabasso Group - דיווח:\n📦 הזמנה: ${loc.orderId}\n👤 לקוח: ${loc.custName}\n📍 כתובת: ${loc.name}\n✅ הושלם ב: ${loc.time || ''}`);
            const reportUrl = `https://wa.me/972${managerNum.replace(/^0/, '')}?text=${reportMsg}`;

            item.innerHTML = `
                <span class="badge">${loc.reported ? 'בוצע: ' + loc.time : (isLocked ? '🔒 חסום' : '🚚 התחנה הבאה')}</span>
                <div style="font-weight:bold;">${i+1}. ${loc.custName} (#${loc.orderId})</div>
                <div style="font-size:0.85rem; color:#666;">${loc.name}</div>
                <div class="actions">
                    ${!loc.completed && !isLocked ? `
                        <a href="https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes" class="btn btn-waze">Waze</a>
                        <a href="tel:${loc.phone}" class="btn btn-call" ${!loc.phone ? 'style="display:none"' : ''}>חיוג</a>
                        <button onclick="markDone(${i})" class="btn" style="background:var(--brand); color:var(--gold);">סיימתי</button>
                    ` : ''}
                    ${loc.completed && !loc.reported ? `
                        <a href="${reportUrl}" target="_blank" class="btn btn-whatsapp" onclick="markReported(${i})">דווח למנהל לשחרור הבא 🔓</a>
                    ` : ''}
                </div>`;
            list.appendChild(item);
            const icon = L.divIcon({ className: 'number-marker', html: i + 1, iconSize: [25, 25] });
            markers.push(L.marker([loc.lat, loc.lng], {icon}).addTo(map));
        });
        if(markers.length > 0) map.fitBounds(new L.featureGroup(markers).getBounds().pad(0.2));
    }

    function markDone(i) { 
        locations[i].completed = true; 
        locations[i].time = new Date().toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
        updateUI(); 
    }
    function markReported(i) { locations[i].reported = true; setTimeout(updateUI, 1000); }

    function optimizeForDriver() {
        navigator.geolocation.getCurrentPosition(pos => {
            const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
            let unvisited = locations.filter(l => !l.reported);
            let done = locations.filter(l => l.reported);
            let optimized = [];
            let cLat = uLat, cLng = uLng;

            while (unvisited.length > 0) {
                let closestIdx = 0, minDist = Infinity;
                unvisited.forEach((loc, idx) => {
                    let d = Math.sqrt(Math.pow(loc.lat - cLat, 2) + Math.pow(loc.lng - cLng, 2));
                    if (d < minDist) { minDist = d; closestIdx = idx; }
                });
                let next = unvisited.splice(closestIdx, 1)[0];
                optimized.push(next);
                cLat = next.lat; cLng = next.lng;
            }
            locations = [...done, ...optimized];
            updateUI();
            alert("המסלול סודר מהקרוב לרחוק! 🚀");
        }, () => alert("נא לאשר גישה למיקום"));
    }

    function exportSummary() {
        let csv = "מספר הזמנה,שם לקוח,כתובת,זמן סיום\n";
        locations.forEach(loc => {
            csv += `${loc.orderId},${loc.custName},${loc.name},${loc.time || 'לא בוצע'}\n`;
        });
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `Cabasso_Summary_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function clearAll() { if(confirm("למחוק הכל?")) { locations = []; localStorage.removeItem('cabasso_strict'); updateUI(); } }
</script>
</body>
</html>
