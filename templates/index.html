<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Pro | ניהול חלוקה</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #1a1a1a; --accent: #d4a373; --bg: #fdfbf7; --success: #28a745; --wa: #25d366; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; }
        .glass-card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; margin-bottom: 10px; box-sizing: border-box; }
        #map { height: 250px; border-radius: 12px; margin-bottom: 15px; z-index: 1; border: 1px solid #eee; }
        button { border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; padding: 14px; font-size: 1rem; transition: 0.2s; }
        .btn-import { background: var(--wa); color: white; margin-bottom: 10px; }
        .btn-opt { background: var(--accent); color: white; margin-top: 10px; }
        .route-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .route-item.completed { opacity: 0.5; filter: grayscale(1); }
        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .action-btn { flex: 1; text-align: center; padding: 8px; border-radius: 8px; color: white; text-decoration: none; font-size: 0.8rem; font-weight: bold; }
        .waze { background: #33ccff; } .gmaps { background: #4285f4; } .call { background: var(--success); }
        .v-check { width: 35px; height: 35px; border: 2px solid var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--success); }
        .completed .v-check { background: var(--success); color: white; }
        #status-box { display: none; background: #333; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .progress-bar { height: 8px; background: #555; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--wa); width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center; margin-bottom: 15px;">
        <h2 style="margin:0;">DELIVERY PRO</h2>
    </header>

    <div id="status-box">
        <div id="status-text">מתחיל ייבוא...</div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    </div>

    <div class="glass-card">
        <textarea id="bulkImport" placeholder="הדבק כאן רשימת כתובות (כתובת בכל שורה)"></textarea>
        <button class="btn-import" id="importBtn" onclick="startSmartImport()">ייבא רשימה כעת ✨</button>
        <div id="map"></div>
        <button class="btn-opt" onclick="optimizeRoute()">סדר מסלול אופטימלי 🚀</button>
    </div>

    <div id="addressList"></div>
    <center><button onclick="clearAll()" style="background:none; color:red; font-size:0.8rem; width: auto; padding: 5px;">איפוס הכל</button></center>
</div>

<audio id="pingSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([32.0853, 34.7818], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var locations = JSON.parse(localStorage.getItem('delivery_v11')) || [];
    var markers = [];

    function save() { localStorage.setItem('delivery_v11', JSON.stringify(locations)); }

    async function startSmartImport() {
        const text = document.getElementById('bulkImport').value;
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 3);
        if(lines.length === 0) return alert("נא להזין כתובות");

        const btn = document.getElementById('importBtn');
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');

        btn.disabled = true;
        statusBox.style.display = 'block';

        for (let i = 0; i < lines.length; i++) {
            const addr = lines[i];
            statusText.innerText = `מחפש: ${addr}`;
            progressFill.style.width = `${((i + 1) / lines.length) * 100}%`;

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1`;
                const response = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } });
                const data = await response.json();

                if (data && data.length > 0) {
                    locations.push({
                        name: addr,
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon),
                        phone: '',
                        completed: false
                    });
                    save();
                    updateUI();
                }
            } catch (e) { console.error("נכשל בכתובת: " + addr); }

            // השהיה דינמית - גדלה ככל שיש יותר כתובות כדי למנוע חסימה
            await new Promise(r => setTimeout(r, 2000)); 
        }

        statusBox.style.display = 'none';
        btn.disabled = false;
        document.getElementById('bulkImport').value = '';
        alert("הייבוא הושלם בהצלחה!");
    }

    function updateUI() {
        const list = document.getElementById('addressList');
        list.innerHTML = '';
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        locations.forEach((loc, i) => {
            const item = document.createElement('div');
            item.className = `route-item ${loc.completed ? 'completed' : ''}`;
            item.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b>${i+1}. ${loc.name}</b>
                    <div class="v-check" onclick="toggle(${i})">${loc.completed ? '✓' : ''}</div>
                </div>
                <div class="actions">
                    <a href="https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes" target="_blank" class="action-btn waze">Waze</a>
                    <a href="https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}" target="_blank" class="action-btn gmaps">Maps</a>
                </div>`;
            list.appendChild(item);
            markers.push(L.marker([loc.lat, loc.lng]).addTo(map));
        });
        if(markers.length > 0) map.fitBounds(new L.featureGroup(markers).getBounds().pad(0.2));
    }

    function toggle(i) {
        locations[i].completed = !locations[i].completed;
        if(locations[i].completed) document.getElementById('pingSound').play().catch(() => {});
        save(); updateUI();
    }

    async function optimizeRoute() {
        if(locations.length < 2) return;
        const res = await fetch('/optimize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ locations }) });
        locations = (await res.json()).map(l => ({...l, completed: false}));
        save(); updateUI();
    }

    function clearAll() { if(confirm("למחוק הכל?")) { locations = []; save(); updateUI(); location.reload(); } }
    updateUI();
</script>
</body>
</html>
