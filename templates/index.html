<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabasso Group | Restricted Route</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #1a1a1a; --gold: #c5a059; --bg: #f4f4f4; --white: #fff; --green: #27ae60; --locked: #95a5a6; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; padding: 15px; background: var(--brand); color: var(--gold); border-radius: 15px; margin-bottom: 10px; border-bottom: 3px solid var(--gold); }
        .glass-card { background: var(--white); border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-family: inherit; }
        
        .route-item { background: var(--white); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid var(--gold); position: relative; transition: 0.3s; }
        .route-item.locked { opacity: 0.5; filter: grayscale(1); pointer-events: none; border-right-color: var(--locked); }
        .route-item.completed { border-right-color: var(--green); background: #f0fdf4; }
        
        .lock-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.6); z-index: 5; border-radius: 12px; font-weight: bold; color: #555; }

        .actions { display: flex; gap: 5px; margin-top: 10px; }
        .action-btn { flex: 1; text-align: center; padding: 12px; border-radius: 8px; color: white; text-decoration: none; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .waze { background: #33ccff; } 
        .whatsapp-report { background: var(--green); box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 20px; background: #eee; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CABASSO GROUP</h1>
        <p id="mode-text">מערכת חלוקה מבוקרת</p>
    </header>

    <div class="glass-card" style="background: #222; color: white;">
        <label style="font-size: 0.8rem; color: #aaa;">מספר מנהל לדיווח:</label>
        <input type="tel" id="managerPhone" placeholder="0501234567" onchange="saveManager()" style="background:#333; color:white; border:none;">
    </div>

    <div class="glass-card" id="admin-inputs">
        <input type="text" id="custName" placeholder="שם לקוח">
        <input type="text" id="addressInput" placeholder="כתובת למשלוח">
        <button onclick="addNewLocation()" style="background:var(--brand); color:var(--gold); width:100%; padding:12px; border-radius:8px; font-weight:bold; border:1px solid var(--gold);">הוסף למסלול +</button>
        <button onclick="shareRoute()" style="background:#007bff; color:white; width:100%; margin-top:5px; padding:12px; border-radius:8px; border:none; font-weight:bold;">שלח לנהג 📲</button>
    </div>

    <div id="addressList" style="margin-top: 15px;"></div>
</div>

<script>
    var locations = [];
    var routeId = new URLSearchParams(window.location.search).get('r');
    
    // שליפת מספר מנהל
    document.getElementById('managerPhone').value = localStorage.getItem('manager_num') || '';
    function saveManager() { localStorage.setItem('manager_num', document.getElementById('managerPhone').value); }

    window.onload = async function() {
        if (routeId) {
            document.getElementById('admin-inputs').style.display = 'none';
            // כאן תבוא פקודת fetch לשרת לקבלת הנתונים (מוחזר לפי ה-ID)
            // לצורך הדוגמה נשתמש ב-localStorage
            locations = JSON.parse(localStorage.getItem('cabasso_sync')) || [];
        } else {
            locations = JSON.parse(localStorage.getItem('cabasso_sync')) || [];
        }
        updateUI();
    };

    function updateUI() {
        const list = document.getElementById('addressList');
        list.innerHTML = '';
        
        let firstIncompleteFound = false;

        locations.forEach((loc, i) => {
            const item = document.createElement('div');
            
            // לוגיקת חסימה: אם זו לא התחנה הראשונה שלא הושלמה, היא נעולה
            let isLocked = false;
            if (firstIncompleteFound && !loc.completed) {
                isLocked = true;
            }
            if (!loc.completed) firstIncompleteFound = true;

            item.className = `route-item ${loc.completed ? 'completed' : ''} ${isLocked ? 'locked' : ''}`;
            
            const managerNum = document.getElementById('managerPhone').value;
            const reportMsg = encodeURIComponent(`✅ דו"ח חלוקה - קבוצת קבסו:\nהזמנה: ${loc.orderId || '---'}\nלקוח: ${loc.custName}\nבוצע בהצלחה!`);
            const reportUrl = `https://wa.me/972${managerNum.replace(/^0/, '')}?text=${reportMsg}`;

            item.innerHTML = `
                ${isLocked ? '<div class="lock-overlay">🔒 ממתין לדיווח תחנה קודמת</div>' : ''}
                <span class="status-badge">${loc.completed ? 'הושלם ✅' : (isLocked ? 'נעול' : 'בתהליך 🚚')}</span>
                <div style="font-weight:bold; font-size:1.1rem;">${i+1}. ${loc.custName}</div>
                <div style="font-size:0.9rem; color:#666;">${loc.name}</div>
                
                <div class="actions">
                    ${!loc.completed && !isLocked ? `
                        <a href="https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes" class="action-btn waze">ניווט ליעד</a>
                        <button onclick="markDone(${i})" style="background:var(--brand); color:white; border:none; border-radius:8px; padding:0 15px; font-weight:bold;">סיימתי</button>
                    ` : ''}
                    
                    ${loc.completed ? `
                        <a href="${reportUrl}" target="_blank" class="action-btn whatsapp-report" onclick="unlockNext(${i})">שלח דיווח למנהל לשחרור המשך 🔓</a>
                    ` : ''}
                </div>
            `;
            list.appendChild(item);
        });
    }

    function markDone(i) {
        locations[i].completed = true;
        localStorage.setItem('cabasso_sync', JSON.stringify(locations));
        updateUI();
        alert("החלוקה סומנה. כעת חובה ללחוץ על 'שלח דיווח למנהל' כדי להמשיך לכתובת הבאה.");
    }

    function unlockNext(i) {
        // בחיים האמיתיים כאן נעדכן את השרת שהדיווח נשלח
        console.log("דיווח נשלח למנהל עבור תחנה " + (i+1));
        updateUI();
    }

    // פונקציות עזר להוספה ושיתוף (כמו קודם)
    async function addNewLocation() {
        const addr = document.getElementById('addressInput').value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1`);
        const data = await res.json();
        if (data.length > 0) {
            locations.push({
                name: addr, custName: document.getElementById('custName').value || 'לקוח',
                lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), completed: false
            });
            localStorage.setItem('cabasso_sync', JSON.stringify(locations));
            updateUI();
        }
    }
</script>
</body>
</html>
